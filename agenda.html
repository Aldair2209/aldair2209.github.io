<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mi Agenda Digital</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
body, html {
    margin: 0;
    padding: 3px;
    font-family: "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #c1e0ee, #62a1f3);
}

/* BOTONES USUARIO Y LOGOUT */
#userDisplay, #btn-logout {
    padding: 8px 14px;
    border: none;
    border-radius: 25px;
    cursor: pointer;
    font-weight: 500;
    display: flex; align-items: center; gap:6px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    transition: 0.3s;
    position: absolute;
    top: 30px;
    z-index: 20;
}
#userDisplay {
    left: 20px;
    background: #4CAF50;
    color: white;
}
#btn-logout {
    right: 20px;
    background: #ff6f61;
    color: white;
}
#userDisplay i, #btn-logout i {
    font-size: 1rem;
}

/* DASHBOARD */
#dashboard {
    display: none;
    max-width: 950px;
    margin: 80px auto 40px auto;
    padding: 30px;
    background: url(https://imgs.search.brave.com/16p0rd_sULE5m8cMXnsANgVZ7MDEXZI7E7lRPtIpfAQ/rs:fit:860:0:0:0/g:ce/aHR0cHM6Ly93YWxs/cGFwZXJzLmNvbS9p/bWFnZXMvaGQvY2Fs/ZW5kYXItcGljdHVy/ZXMtaXkzdjBxbjk4/eW5lZm85Mi5qcGc);
    border-radius: 15px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.12);
}

#dashboard h2 {
    text-align: center;
    color: #111318;
    margin-bottom: 20px;
    font-family: cursive;
}

#dashboard input, #dashboard textarea, #dashboard button {
    width: 90%;
    max-width: 400px;
    padding: 12px;
    margin: 8px auto;
    display: block;
    border-radius: 8px;
    border:1px solid #ffb6b6;
    font-size: 14px;
    
}

#dashboard button {
    background: #628ce7;
    color:white;
    font-weight:bold;
    border:none;
    cursor:pointer;
    transition:0.3s;
}
#dashboard button:hover { background:#4fabf7; }

/* TABLA ESTILO CALENDARIO */
#eventsTable {
    width: 100%;
    border-collapse: separate;
    border-spacing: 10px 10px;
    margin-top: 20px;
}

#eventsTable th, #eventsTable td {
    padding: 12px;
    text-align: center;
    border-radius: 10px;
}

#eventsTable th {
    background: #4fabf7;
    color: white;
}

#eventsTable tbody tr {
    background: #f9f9f9;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    transition:0.3s;
}
#eventsTable tbody tr:hover { background: #e1f0ff; }

.action-btn {
    background: transparent;
    border:none;
    cursor:pointer;
    font-size: 1rem;
    margin:0 4px;
}
.action-btn.edit { color: #4fabf7; }
.action-btn.delete { color: #ff4b4b; }

/* RESPONSIVE */
@media (max-width:600px){
    #dashboard { padding:20px; margin-top:100px; }
    #eventsTable th, #eventsTable td { font-size:13px; padding:8px; }
}
</style>
</head>
<body>

<!-- BOTONES USUARIO Y LOGOUT -->
<button id="btn-logout" style="display:none;" onclick="logout()"><i class="fa fa-right-from-bracket"></i> Cerrar Sesión</button>
<button id="userDisplay" style="display:none;"><i class="fa fa-user"></i> Usuario</button>

<!-- DASHBOARD -->
<section id="dashboard">
    <h2>Agendar Evento</h2>
    <input type="text" id="eventTitle" placeholder="Título del evento">
    <input type="date" id="eventDate">
    <input type="time" id="eventTime">
    <textarea id="eventDesc" placeholder="Descripción" rows="3"></textarea>
    <button onclick="saveEvent()">Guardar Evento</button>

    <h3 style="font-family: cursive;">Mis Eventos Agendados</h3>
    <table id="eventsTable">
        <thead>
            <tr>
                <th>Título</th>
                <th>Fecha</th>
                <th>Hora</th>
                <th>Descripción</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</section>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-app.js";
import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-auth.js";
import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyATMynxurMN4LNI18z_ATn_OhGGJ9Ko4zk",
    authDomain: "ciberseguridad22.firebaseapp.com",
    projectId: "ciberseguridad22",
    storageBucket: "ciberseguridad22.appspot.com",
    messagingSenderId: "799641106752",
    appId: "1:799641106752:web:6bfe439994a9281ffc62a5"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

window.saveEvent = async function () {
    const user = auth.currentUser;
    const title = document.getElementById("eventTitle").value;
    const date = document.getElementById("eventDate").value;
    const time = document.getElementById("eventTime").value;
    const desc = document.getElementById("eventDesc").value;
    if (!title || !date || !time) { alert("Completa los campos obligatorios"); return; }
    try {
        await addDoc(collection(db, "eventos"), { uid: user.uid, title, date, time, desc, createdAt: new Date() });
        document.getElementById("eventTitle").value="";
        document.getElementById("eventDate").value="";
        document.getElementById("eventTime").value="";
        document.getElementById("eventDesc").value="";
    } catch (e) { alert("Error: " + e.message); }
}

window.logout = async function () {
    try {
        await signOut(auth);
        window.location.href = "index.html";
    } catch (e) { alert("Error al cerrar sesión"); console.error(e); }
}

// Control de sesión
onAuthStateChanged(auth, (user) => {
    const userDisplay = document.getElementById("userDisplay");
    const logoutBtn = document.getElementById("btn-logout");
    const dashboard = document.getElementById("dashboard");

    if (user) {
        userDisplay.style.display = "flex";
        userDisplay.textContent = ` ${user.email}`;
        logoutBtn.style.display = "flex";
        dashboard.style.display = "block";

        const q = query(collection(db, "eventos"), orderBy("createdAt", "desc"));
        onSnapshot(q, (snapshot) => {
            const table = document.getElementById("eventsTable").querySelector("tbody");
            table.innerHTML = "";
            snapshot.forEach(docSnap => {
                const data = docSnap.data();
                if (data.uid === user.uid) {
                    const row = document.createElement("tr");
                    row.innerHTML = `
                        <td>${data.title}</td>
                        <td>${data.date}</td>
                        <td>${data.time}</td>
                        <td>${data.desc}</td>
                        <td>
                            <button class="action-btn edit" onclick="editEvent('${docSnap.id}','${data.title}','${data.date}','${data.time}','${data.desc}')"><i class="fa fa-pen"></i></button>
                            <button class="action-btn delete" onclick="deleteEvent('${docSnap.id}')"><i class="fa fa-trash"></i></button>
                        </td>`;
                    table.appendChild(row);
                }
            });
        });

    } else {
        userDisplay.style.display = "none";
        logoutBtn.style.display = "none";
        dashboard.style.display = "none";
        alert("Debes iniciar sesión"); // Puedes redirigir a login si quieres
        window.location.href = "index.html";
    }
});

// Eliminar evento
window.deleteEvent = async function(id){
    if(confirm("¿Deseas eliminar este evento?")){
        await deleteDoc(doc(db,"eventos",id));
    }
}

// Editar evento
window.editEvent = function(id,title,date,time,desc){
    document.getElementById("eventTitle").value = title;
    document.getElementById("eventDate").value = date;
    document.getElementById("eventTime").value = time;
    document.getElementById("eventDesc").value = desc;

    const saveBtn = document.querySelector("#dashboard button");
    saveBtn.textContent = "Actualizar Evento";
    saveBtn.onclick = async function(){
        const newTitle = document.getElementById("eventTitle").value;
        const newDate = document.getElementById("eventDate").value;
        const newTime = document.getElementById("eventTime").value;
        const newDesc = document.getElementById("eventDesc").value;
        if(!newTitle || !newDate || !newTime){ alert("Completa los campos obligatorios"); return; }
        await updateDoc(doc(db,"eventos",id), { title:newTitle, date:newDate, time:newTime, desc:newDesc });
        saveBtn.textContent = "Guardar Evento";
        saveBtn.onclick = window.saveEvent;
        document.getElementById("eventTitle").value="";
        document.getElementById("eventDate").value="";
        document.getElementById("eventTime").value="";
        document.getElementById("eventDesc").value="";
    }
}
</script>

</body>
</html
