<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Caso Práctico - Auditoría de Sistemas en INTELIGENCIA ARTIFICIAL</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --text: #0f1724;
      --muted: #6b7280;
      --accent: #0b79d0;
      --danger: #e63946;
      --success: #2a9d8f;
    }
    [data-theme='dark'] {
      --bg: #0b1220;
      --card: #081021;
      --text: #e6eef8;
      --muted: #9aa6bb;
      --accent: #4aa3ff;
      --danger: #ff6b6b;
      --success: #3dd68c;
    }
    * { box-sizing: border-box; transition: background 0.3s, color 0.3s; }
    body { font-family: "Segoe UI", Roboto, Arial, sans-serif; margin: 0; background: var(--bg); color: var(--text); line-height: 1.6; }
    .container { max-width: 1100px; margin: 28px auto; padding: 20px; }
    header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px; }
    h1 { margin: 0; font-size: 1.8rem; }
    p.lead { color: var(--muted); margin: 6px 0 18px; font-size: 1rem; }
    .controls-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
    .card { background: var(--card); border-radius: 14px; padding: 16px; box-shadow: 0 6px 18px rgba(15, 23, 36, 0.08); animation: fadeIn 0.5s ease; }
    .card h3 { margin: 0 0 6px; font-size: 1.2rem; }
    .muted { color: var(--muted); font-size: 0.95rem; }
    .process-list { margin: 10px 0 0; padding-left: 18px; }
    .controls-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    button { cursor: pointer; border: 0; padding: 8px 12px; border-radius: 8px; font-weight: 600; transition: all 0.25s; }
    button:hover { opacity: 0.9; transform: translateY(-2px); }
    .btn-primary { background: var(--accent); color: white; }
    .btn-ghost { background: transparent; color: var(--accent); border: 1px solid rgba(11, 121, 208, 0.2); }
    .btn-danger { background: var(--danger); color: white; }
    footer { margin-top: 30px; text-align: center; color: var(--muted); font-size: 0.9rem; }
    @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

    /* === Modal BPM === */
    #bpmModal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.65);
      z-index: 2000;
      align-items: center;
      justify-content: center;
    }
    #bpmModal .modal-content {
      background: var(--card);
      padding: 20px;
      border-radius: 12px;
      max-width: 90%;
      max-height: 90%;
      overflow: auto;
      box-shadow: 0 6px 18px rgba(0,0,0,0.25);
      animation: fadeIn 0.3s ease;
    }
    #bpmModal .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    #bpmModal .modal-header h3 { margin: 0; font-size: 1.2rem; }
    #bpmModal .close-btn {
      background: var(--danger);
      color: white;
      border: none;
      border-radius: 6px;
      padding: 4px 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>Auditoría de Sistemas en IA Solutions S.A.C.</h1>
        <p class="lead">Presentación interactiva de controles de auditoría en ciberseguridad, datos y operaciones.</p>
      </div>
      <div class="top-actions flex-row">
        <button id="toggleTheme" class="btn-ghost">Modo oscuro</button>
      </div>
    </header>

    <section style="margin-top:16px">
      <div class="controls-grid" id="controlsGrid"></div>
    </section>

    <footer>
      Diseño: caso práctico para auditoría de sistemas e informática (IA).
    </footer>
  </div>

  <!-- === Modal BPM === -->
  <div id="bpmModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Diagrama BPM</h3>
        <button class="close-btn" id="closeBpm">Cerrar</button>
      </div>
      <div id="bpmDiagram"></div>
    </div>
  </div>

  <!-- Mermaid -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script>
    mermaid.initialize({ startOnLoad: false });

    let controls = [
      {
        id: 1, title: 'Control de Accesos a Sistemas Críticos',
        objective: 'Garantizar que solo personal autorizado acceda a los sistemas de IA.',
        steps: ['Registrar usuarios en IAM.', 'Aplicar MFA.', 'Revisar cuentas activas.', 'Generar reportes de accesos.']
      },
      {
        id: 2, title: 'Control de Seguridad de Datos Sensibles',
        objective: 'Proteger datos de IA con cifrado y monitoreo.',
        steps: ['Clasificar datos.', 'Aplicar cifrado AES-256.', 'Monitorear con DLP.', 'Pruebas de acceso restringido.']
      }
    ];

    const grid = document.getElementById('controlsGrid');
    function createCard(ctrl) {
      const div = document.createElement('div');
      div.className = 'card';
      div.innerHTML = `
        <h3>${ctrl.title}</h3>
        <div class="muted">${ctrl.objective}</div>
        <div class="accordion-body">
          <ol class="process-list">
            ${ctrl.steps.map(s => `<li>${s}</li>`).join('')}
          </ol>
          <div class="controls-actions">
            <button class="btn-ghost btn-bpm" data-id="${ctrl.id}">Ver BPM</button>
          </div>
        </div>`;
      grid.appendChild(div);
    }
    function renderAll() { grid.innerHTML = ''; controls.forEach(createCard); }
    renderAll();

    // Evento botones
    document.addEventListener('click', (e) => {
      if (e.target.matches('.btn-bpm')) {
        const id = Number(e.target.dataset.id);
        const c = controls.find(x => x.id === id);
        if (!c) return;

        let mermaidDef = `
graph LR
    classDef startNode fill:#2a9d8f,stroke:#000,stroke-width:2px,color:#fff,font-size:14px;
    classDef endNode fill:#e63946,stroke:#000,stroke-width:2px,color:#fff,font-size:14px;
    classDef processNode fill:#7ec8e3,stroke:#000,stroke-width:1.5px,color:#000,font-size:12px;

    A((Inicio)):::startNode
`;
        c.steps.forEach((step, i) => {
          const text = step.replace(/(.{30})/g, "$1\\n");
          if (i === 0) {
            mermaidDef += `A --> B0["${text}"]:::processNode\n`;
          } else {
            mermaidDef += `B${i - 1} --> B${i}["${text}"]:::processNode\n`;
          }
        });
        mermaidDef += `B${c.steps.length - 1} --> Z((Fin)):::endNode\n`;

        mermaid.render(`theGraph${id}`, mermaidDef).then(({ svg }) => {
          document.getElementById('bpmDiagram').innerHTML = svg;
          document.getElementById('bpmModal').style.display = 'flex';
        });
      }
      if (e.target.id === 'closeBpm') {
        document.getElementById('bpmModal').style.display = 'none';
        document.getElementById('bpmDiagram').innerHTML = '';
      }
    });

    // Tema
    const themeBtn = document.getElementById('toggleTheme');
    themeBtn.addEventListener('click', () => {
      const cur = document.documentElement.getAttribute('data-theme');
      if (cur === 'dark') {
        document.documentElement.removeAttribute('data-theme');
        themeBtn.textContent = 'Modo oscuro';
      } else {
        document.documentElement.setAttribute('data-theme', 'dark');
        themeBtn.textContent = 'Modo claro';
      }
    });
  </script>
</body>
</html>
