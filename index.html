<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Caso Práctico - Auditoría de Sistemas en IA Solutions</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');

    :root {
      --bg: #f4f6fa;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --accent: #2563eb;
      --accent-hover: #1e40af;
    }

    [data-theme='dark'] {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #1d4ed8;
    }

    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    .container {
      max-width: 1100px;
      margin: 32px auto;
      padding: 0 16px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    h1 {
      font-size: 1.8rem;
      margin: 0;
      font-weight: 600;
    }

    p.lead {
      margin: 6px 0 18px;
      color: var(--muted);
    }

    .card {
      background: var(--card);
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.05);
      transition: transform 0.2s;
    }

    .card:hover {
      transform: translateY(-2px);
    }

    .controls-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .card h3 {
      margin-top: 0;
      font-size: 1.2rem;
    }

    .muted {
      color: var(--muted);
      font-size: 0.95rem;
    }

    button {
      cursor: pointer;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: 600;
      background: var(--accent);
      color: #fff;
      transition: background 0.3s, transform 0.2s;
    }

    button:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    .btn-ghost {
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--accent);
    }

    .accordion {
      margin-top: 12px;
      padding: 8px 0;
      font-weight: 600;
      color: var(--accent);
      cursor: pointer;
    }

    .accordion-body {
      display: none;
      margin-top: 8px;
      animation: fadeIn 0.3s ease-in-out;
    }

    @keyframes fadeIn {
      from {opacity: 0;}
      to {opacity: 1;}
    }

    footer {
      margin-top: 24px;
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0; top: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: var(--card);
      padding: 20px;
      border-radius: 12px;
      width: 90%;
      max-width: 480px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
      text-align: left;
    }

    .modal-content h3 {
      margin-top: 0;
      font-size: 1.3rem;
    }

    .modal-content label {
      display: block;
      font-weight: 600;
      margin-top: 10px;
    }

    .modal-content input,
    .modal-content textarea {
      width: 100%;
      margin-top: 4px;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      font-family: inherit;
      font-size: 0.95rem;
      background: var(--bg);
      color: var(--text);
    }

    .modal-content textarea {
      resize: vertical;
      min-height: 60px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 16px;
    }

  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>Caso práctico: Auditoría en IA Solutions</h1>
        <p class="lead">Gestión de controles de auditoría con procesos y diagramas BPM.</p>
      </div>
      <div>
        <button id="toggleTheme" class="btn-ghost">🌙 Modo oscuro</button>
        <button id="addControlBtn">➕ Agregar control</button>
      </div>
    </header>

    <div class="controls-grid" id="controlsGrid"></div>

    <footer>
      © 2025 Caso práctico de auditoría de sistemas en IA Solutions.
    </footer>
  </div>

  <!-- Modal para agregar control -->
  <div id="controlModal" class="modal">
    <div class="modal-content">
      <h3>Agregar nuevo control</h3>
      <label>Nombre del control</label>
      <input id="newTitle" placeholder="Ej: Control de accesos"/>

      <label>Objetivo</label>
      <input id="newObjective" placeholder="Ej: Garantizar seguridad en accesos"/>

      <label>Procesos (separados por salto de línea)</label>
      <textarea id="newSteps" placeholder="Proceso 1\nProceso 2\nProceso 3"></textarea>

      <div class="modal-actions">
        <button id="cancelModal" class="btn-ghost">Cancelar</button>
        <button id="saveControl">Guardar</button>
      </div>
    </div>
  </div>

  <script>
    const controls = [];
    const grid = document.getElementById("controlsGrid");

    function createCard(ctrl) {
      const div = document.createElement("div");
      div.className = "card";
      div.innerHTML = `
        <h3>${ctrl.title}</h3>
        <div class="muted">${ctrl.objective}</div>
        <div class="accordion">Procesos (clic para ver)</div>
        <div class="accordion-body">
          <ol>${ctrl.steps.map(s => `<li>${s}</li>`).join("")}</ol>
        </div>
      `;
      grid.appendChild(div);

      const acc = div.querySelector(".accordion");
      const body = div.querySelector(".accordion-body");
      acc.addEventListener("click", () => {
        body.style.display = body.style.display === "block" ? "none" : "block";
      });
    }

    // Modal
    const modal = document.getElementById("controlModal");
    const addBtn = document.getElementById("addControlBtn");
    const cancelBtn = document.getElementById("cancelModal");
    const saveBtn = document.getElementById("saveControl");

    addBtn.addEventListener("click", () => { modal.style.display = "flex"; });
    cancelBtn.addEventListener("click", () => { modal.style.display = "none"; });

    saveBtn.addEventListener("click", () => {
      const title = document.getElementById("newTitle").value.trim();
      const objective = document.getElementById("newObjective").value.trim();
      const steps = document.getElementById("newSteps").value.trim().split("\n").filter(s => s);

      if (!title || !objective || steps.length === 0) {
        alert("Completa todos los campos.");
        return;
      }

      const newCtrl = { title, objective, steps };
      controls.push(newCtrl);
      createCard(newCtrl);

      modal.style.display = "none";
      document.getElementById("newTitle").value = "";
      document.getElementById("newObjective").value = "";
      document.getElementById("newSteps").value = "";
    });

    // Theme toggle
    const themeBtn = document.getElementById("toggleTheme");
    themeBtn.addEventListener("click", () => {
      const cur = document.documentElement.getAttribute("data-theme");
      if (cur === "dark") {
        document.documentElement.removeAttribute("data-theme");
        themeBtn.textContent = "🌙 Modo oscuro";
      } else {
        document.documentElement.setAttribute("data-theme", "dark");
        themeBtn.textContent = "☀️ Modo claro";
      }
    });
  </script>
</body>
</html>
